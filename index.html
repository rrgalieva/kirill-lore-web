<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#070d1b"><title>Тест по лору Кирюшки</title><style>
:root{font-family:-apple-system,BlinkMacSystemFont,'SF Pro Display','SF Pro Text',sans-serif;color:#f8faff;background:#070d1b}*{box-sizing:border-box}body{margin:0;min-height:100dvh;background:radial-gradient(ellipse at 50% -10%,#2b69e8 0%,#122e70 34%,#090f24 66%,#06080e 100%);background-attachment:fixed}button,input,textarea,select{font:inherit}button{cursor:pointer}button:disabled{opacity:.35;cursor:default}.app{max-width:530px;margin:auto;min-height:100dvh;padding:28px 20px 44px;text-align:center}.eyebrow{font-size:11px;letter-spacing:.22em;font-weight:700;color:#c4d2ff;text-transform:uppercase}.hero{padding-top:clamp(40px,12vh,110px)}h1{font-size:clamp(48px,13vw,76px);line-height:.95;letter-spacing:-.07em;font-weight:750;margin:23px 0;background:linear-gradient(#fff,#a9c0ff);color:transparent;background-clip:text}h2{font-size:clamp(26px,7vw,36px);line-height:1.13;letter-spacing:-.035em;margin:12px 0 25px}p{color:#bec8e4;line-height:1.55}.glass{background:linear-gradient(145deg,#ffffff24,#ffffff0b);border:1px solid #ffffff28;box-shadow:0 18px 50px #0005;backdrop-filter:blur(20px);border-radius:26px;padding:20px}.glow{width:190px;height:190px;margin:20px auto 26px;border-radius:34px;background:radial-gradient(circle at 25% 15%,#9cc8ff,#4779fc 44%,#6b38e4 80%,#1b1c53);box-shadow:0 0 85px #586bff70;display:grid;place-items:center;transform:rotate(-9deg)}.glow span{font-size:76px;transform:rotate(9deg)}.field{width:100%;border:1px solid #ffffff35;background:#ffffff16;color:white;border-radius:17px;padding:16px;text-align:center;outline:none}.field::placeholder{color:#aab7d5}.primary{width:100%;padding:17px;border:0;border-radius:17px;background:linear-gradient(105deg,#b59aff,#5687ff);color:white;font-weight:700;box-shadow:0 10px 28px #5572ff48}.secondary{border:1px solid #ffffff30;color:#e1e8ff;background:#ffffff12;border-radius:15px;padding:12px 16px}.stack{display:grid;gap:12px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:22px;gap:12px}.progress{height:5px;background:#ffffff22;border-radius:9px;overflow:hidden;margin-bottom:35px}.progress>div{height:100%;background:#a99aff;transition:width .2s}.option{display:block;width:100%;border:1px solid #ffffff2a;background:#ffffff12;color:#f5f7ff;padding:16px;border-radius:16px;text-align:center;min-height:58px}.option.selected{background:#7584ff55;border-color:#bdc3ff}.option.correct{border-color:#65dfa5;background:#23754c66}.option.wrong{border-color:#ff8a9e;background:#94374b66}.photo-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin:15px 0}.photo-card{position:relative;overflow:hidden;border:2px solid #ffffff29;border-radius:17px;background:#ffffff0d;padding:0;color:white}.photo-card.selected{border-color:#b6a2ff}.photo-card img{width:100%;height:195px;object-fit:cover;display:block}.photo-card span{position:absolute;left:8px;bottom:8px;background:#0a103acc;border-radius:9px;padding:6px 10px}.photo-card.empty{height:180px;display:grid;place-items:center;padding:15px;color:#a9b5d5}.small{font-size:12px;color:#aab7d4}.result-number{font-size:72px;font-weight:800;letter-spacing:-.08em;margin:12px}.review{text-align:left;padding:16px;margin:10px 0}.review h3{font-size:16px;margin:0 0 12px}.review p{margin:7px 0;font-size:13px}.good{color:#77efb6}.bad{color:#ff9aa8}.muted{color:#b3c0e0}.editor{max-width:750px;margin:auto;padding:20px}.editor textarea,.editor input,.editor select{width:100%;text-align:left;background:#0e1b38;border:1px solid #ffffff30;color:white;padding:11px;border-radius:10px;margin:5px 0 10px}.editor textarea{min-height:75px;resize:vertical}.edit-card{margin:12px 0;padding:17px;border:1px solid #ffffff25;border-radius:18px;background:#ffffff0b}.editor label{font-size:12px;color:#b8c7e8}.editor .actions{display:flex;gap:8px;flex-wrap:wrap;margin:15px 0}.editor .actions button{flex:1}.hidden{display:none!important}a{color:#c8bcff}hr{border:0;border-top:1px solid #ffffff25;margin:20px 0}
</style><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script><script src="config.js"></script></head><body><main id="app" class="app"></main><script>
const DEFAULT_QUESTIONS=[];
const KEY='kirill-lore-public-questions-v2';let questions=[];let player='',idx=0,answers={},started=0,screen='home',attemptToken=null,serverResult=null;let db=null,admin=false,cloudReady=false;try{if(window.KIRILL_CONFIG?.url&&window.KIRILL_CONFIG?.anonKey&&window.supabase){db=window.supabase.createClient(window.KIRILL_CONFIG.url,window.KIRILL_CONFIG.anonKey);cloudReady=true}}catch(e){console.warn(e)}const app=document.getElementById('app');const escapeHtml=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const img=k=>k+'.jpg';function save(){if(!admin)return;localStorage.setItem('kirill-admin-draft-v2',JSON.stringify(questions));if(cloudReady){clearTimeout(window.saveTimer);window.saveTimer=setTimeout(()=>publishQuestions(),900)}}function nav(s){screen=s;render();window.scrollTo(0,0)}
function render(){app.className=screen==='edit'?'editor':'app';if(screen==='home')home();if(screen==='quiz')quiz();if(screen==='result')result();if(screen==='edit')editor();if(screen==='scores')scores()}
function home(){app.innerHTML=`<div class="hero"><div class="eyebrow">THE ULTIMATE BIRTHDAY EXAM</div><h1>Тест по лору<br>Кирюшки</h1><p>17 вопросов. Один именинник.<br>Слишком много легендарных историй.</p><div class="glow"><span>✦</span></div><div class="glass stack"><div class="eyebrow">ДОПУСК К ЭКЗАМЕНУ</div><input class="field" id="name" maxlength="40" placeholder="Как тебя зовут?" value="${escapeHtml(player)}"><button class="primary" onclick="begin()">Начать экзамен ↗</button></div><p class="small">Результаты и разбор ошибок — в конце</p><button class="secondary" onclick="openEditor()">✎ Редактировать вопросы</button><button class="secondary" style="margin-left:7px" onclick="nav('scores')">Общий рейтинг</button></div>`}
async function begin(){let n=document.getElementById('name').value.trim();if(!n){alert('Введи имя');return}if(!cloudReady)return alert('Соединение с базой недоступно');if(!questions.length)await loadCloud();if(!questions.length)return alert('Вопросы пока не доступны. Сначала настрой SQL миграцию.');let {data,error}=await db.rpc('start_quiz');if(error)return alert('Не удалось начать тест: '+error.message);attemptToken=data;serverResult=null;player=n;idx=0;answers={};started=Date.now();nav('quiz')}
function quiz(){let q=questions[idx];if(!q){nav('result');return}let chosen=answers[q.id];app.innerHTML=`<div class="top"><button class="secondary" onclick="nav('home')">← Выход</button><div class="eyebrow">${idx+1} / ${questions.length}</div><div class="small">${escapeHtml(player)}</div></div><div class="progress"><div style="width:${(idx+1)/questions.length*100}%"></div></div><div class="eyebrow">ВОПРОС ${idx+1}</div><h2>${escapeHtml(q.title)}</h2>${q.images.length?`<div class="photo-grid">${q.options.map((o,i)=>`<button class="photo-card ${chosen===i?'selected':''} ${!q.images[i]?'empty':''}" onclick="choose(${i})">${q.images[i]?`<img src="${img(q.images[i])}" alt="Вариант ${i+1}">`:'Изображение еще не добавлено'}<span>${escapeHtml(o)}</span></button>`).join('')}</div>`:`<div class="stack">${q.options.map((o,i)=>`<button class="option ${chosen===i?'selected':''}" onclick="choose(${i})">${escapeHtml(o)}</button>`).join('')}</div>`}<div style="height:28px"></div><button class="primary" ${chosen===undefined?'disabled':''} onclick="next()">${idx===questions.length-1?'Узнать результат':'Следующий вопрос →'}</button><p class="small">Правильные ответы откроются в конце</p>`}
function choose(i){answers[questions[idx].id]=i;render()}function next(){if(idx<questions.length-1){idx++;render();window.scrollTo(0,0)}else finish()}
function stats(){return serverResult?{correct:serverResult.correct,total:serverResult.total}:{correct:0,total:0}}
async function finish(){if(!cloudReady||!attemptToken)return alert('Нет активной сессии');let duration=Math.max(10,Math.round((Date.now()-started)/1000));let {data,error}=await db.rpc('submit_quiz',{p_token:attemptToken,p_name:player,p_answers:answers,p_duration:duration});if(error)return alert('Не удалось сохранить результат: '+error.message);serverResult=data;attemptToken=null;nav('result')}
function result(){if(!serverResult){nav('home');return}let {correct,total}=stats();let rev=Object.fromEntries((serverResult.review||[]).map(x=>[x.id,x]));app.innerHTML=`<div class="eyebrow">ЭКЗАМЕН ЗАВЕРШЕН</div><h1>ЛОР<br>ЗАСЧИТАН</h1><p>${escapeHtml(player)}, твой результат</p><div class="result-number">${correct}/${total}</div><p>${correct===total?'Ты хранитель лора Кирилла.':correct>=total*.7?'Ты явно был рядом с легендой.':'Пора повторить биографию Кирилла.'}</p><div class="glass"><h2>Разбор ответов</h2>${questions.map((q,i)=>{let a=answers[q.id],r=rev[q.id]||{},ok=a===r.correct_index;return `<div class="review"><div class="small">ВОПРОС ${i+1}</div><h3>${escapeHtml(q.title)}</h3><p class="${r.correct_index===null?'muted':ok?'good':'bad'}">Твой ответ: ${escapeHtml(q.options[a]||'Нет ответа')} ${r.correct_index===null?'· без оценки':ok?'✓':'✕'}</p>${r.correct_index!==null&&r.correct_index!==undefined?`<p class="good">Правильно: ${escapeHtml(q.options[r.correct_index])}</p>`:''}${r.note?`<p class="muted">${escapeHtml(r.note)}</p>`:''}</div>`}).join('<hr>')}</div><div class="stack" style="margin-top:20px"><button class="primary" onclick="nav('scores')">Посмотреть рейтинг</button><button class="secondary" onclick="nav('home')">На главный экран</button></div>`}
async function scores(){let scores=JSON.parse(localStorage.getItem('kirill-local-scores')||'[]').sort((a,b)=>b.correct-a.correct||a.time-b.time);if(cloudReady){let {data,error}=await db.from('scores').select('player_name,correct_count,total_count,duration_seconds').order('correct_count',{ascending:false}).order('duration_seconds',{ascending:true}).limit(100);if(!error)scores=data.map(x=>({name:x.player_name,correct:x.correct_count,total:x.total_count,time:x.duration_seconds}))}app.innerHTML=`<div class="eyebrow">LOCAL HALL OF FAME</div><h1>ЗАЛ<br>СЛАВЫ</h1><p>${cloudReady?'Общий рейтинг всех участников':'Тестовый рейтинг на этом устройстве. Облако еще не подключено.'}</p><div class="glass stack">${scores.length?scores.map((s,i)=>`<div class="option">${i+1}. ${escapeHtml(s.name)} — ${s.correct}/${s.total} · ${s.time} сек.</div>`).join(''):'Пока нет результатов'}</div><div style="height:20px"></div><button class="primary" onclick="nav('home')">На главный экран</button>`}
function editor(){app.innerHTML=`<div class="top"><button class="secondary" onclick="nav('home')">← Главная</button><div class="eyebrow">РЕДАКТОР КВИЗА</div></div><h2>Вопросы и ответы</h2><p>${cloudReady?'Изменения автоматически публикуются в облако после редактирования.':'Пока облако не настроено, изменения сохраняются только в браузере. Скачай JSON для резервной копии.'}</p><div class="actions"><button class="secondary" onclick="downloadJSON()">↓ Скачать JSON</button><button class="secondary" onclick="document.getElementById('import').click()">↑ Импорт JSON</button><button class="secondary" onclick="resetAll()">Сбросить</button><button class="secondary" onclick="publishQuestions()">☁ Опубликовать</button><button class="secondary" onclick="signOutAdmin()">Выйти из админки</button><input class="hidden" id="import" type="file" accept=".json,application/json" onchange="importJSON(this)"></div><div class="small" id="save-state">Готово к редактированию</div><div id="items">${questions.map((q,i)=>editCard(q,i)).join('')}</div><button class="primary" onclick="addQuestion()">+ Добавить вопрос</button>`}
function editCard(q,i){return `<div class="edit-card"><div class="top"><b>${i+1}. ${escapeHtml(q.id)}</b><div><button class="secondary" onclick="moveQ(${i},-1)">↑</button> <button class="secondary" onclick="moveQ(${i},1)">↓</button></div></div><label>Вопрос</label><textarea oninput="setQ(${i},'title',this.value)">${escapeHtml(q.title)}</textarea><label>Варианты (каждый с новой строки)</label><textarea style="min-height:110px" oninput="setOpts(${i},this.value)">${escapeHtml(q.options.join('\n'))}</textarea><label>Правильный ответ</label><select onchange="setCorrect(${i},this.value)"><option value="" ${q.correct===null?'selected':''}>Не выбран — без оценки</option>${q.options.map((o,j)=>`<option value="${j}" ${q.correct===j?'selected':''}>${j+1}. ${escapeHtml(o)}</option>`).join('')}</select><label>Комментарий к ответу</label><textarea oninput="setQ(${i},'note',this.value)">${escapeHtml(q.note||'')}</textarea><div class="small">Фото: ${escapeHtml(q.images.join(', ')||'нет')} · Замена фото в текущей версии через файлы проекта</div><button class="secondary" onclick="deleteQ(${i})">Удалить вопрос</button></div>`}
function setQ(i,k,v){questions[i][k]=v;save()}function setOpts(i,v){questions[i].options=v.split('\n').map(x=>x.trim()).filter(Boolean);questions[i].correct=null;save();}function setCorrect(i,v){questions[i].correct=v===''?null:Number(v);save()}function moveQ(i,d){let j=i+d;if(j<0||j>=questions.length)return;[questions[i],questions[j]]=[questions[j],questions[i]];save();render()}function deleteQ(i){if(confirm('Удалить вопрос?')){questions.splice(i,1);save();render()}}function addQuestion(){questions.push({id:'new'+Date.now(),title:'Новый вопрос',options:['Вариант 1','Вариант 2'],correct:null,note:'',images:[]});save();render()}function resetAll(){if(confirm('Загрузить сохраненные вопросы из облака?')){db.from('quiz_content').select('questions').eq('id',1).single().then(({data,error})=>{if(!error&&Array.isArray(data?.questions)){questions=data.questions;render()}})}}function downloadJSON(){let b=new Blob([JSON.stringify(questions,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='kirill-questions-edited.json';a.click();URL.revokeObjectURL(a.href)}function importJSON(el){let f=el.files[0];if(!f)return;f.text().then(t=>{try{let x=JSON.parse(t);if(!Array.isArray(x)||!x.every(q=>Array.isArray(q.options)&&typeof q.title==='string'))throw Error();questions=x;save();render()}catch(e){alert('Неверный формат JSON')}})}
async function loadCloud(){if(!cloudReady)return;let {data,error}=await db.rpc('get_public_questions');if(!error&&Array.isArray(data)){questions=data;render()}else console.warn('Public quiz not yet available',error)}
async function publishQuestions(){if(!cloudReady){alert('Сначала настрой config.js');return}if(!admin){alert('Войди как редактор');return}let {error}=await db.from('quiz_content').update({questions,updated_at:new Date().toISOString()}).eq('id',1);if(error)alert('Ошибка публикации: '+error.message);else document.getElementById('save-state')&&(document.getElementById('save-state').textContent='Сохранено в облаке ✓')}
async function openEditor(){if(!cloudReady){nav('edit');return}let {data:{user}}=await db.auth.getUser();if(user){let {data}=await db.from('admin_users').select('user_id').eq('user_id',user.id).maybeSingle();if(data){admin=true;let a=await db.from('quiz_content').select('questions').eq('id',1).single();if(!a.error&&Array.isArray(a.data?.questions))questions=a.data.questions;nav('edit');return}}app.innerHTML=`<div class="hero"><div class="eyebrow">ADMIN ACCESS</div><h1>РЕДАКТОР</h1><p>Введи почту, на которую зарегистрирован администратор Supabase. Получишь одноразовый код или ссылку для входа.</p><div class="glass stack"><input class="field" id="admin-email" type="email" placeholder="Твоя почта"><button class="primary" onclick="sendAdminLink()">Получить ссылку для входа</button><button class="secondary" onclick="nav('home')">Назад</button></div></div>`}
async function sendAdminLink(){let email=document.getElementById('admin-email').value.trim();if(!email)return alert('Укажи почту');let {error}=await db.auth.signInWithOtp({email,options:{emailRedirectTo:location.origin+location.pathname}});alert(error?error.message:'Проверь почту, открой ссылку на этом устройстве и снова нажми «Редактировать вопросы».')}
async function signOutAdmin(){if(db)await db.auth.signOut();admin=false;nav('home')}
async function boot(){render();await loadCloud();if(db){let {data:{user}}=await db.auth.getUser();if(user){let {data}=await db.from('admin_users').select('user_id').eq('user_id',user.id).maybeSingle();admin=!!data}}}boot();
</script></body></html>
