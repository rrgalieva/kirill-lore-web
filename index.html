<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#070d1b"><title>Тест по лору Кирюшки</title><style>
:root{font-family:-apple-system,BlinkMacSystemFont,'SF Pro Display','SF Pro Text',sans-serif;color:#f8faff;background:#070d1b}*{box-sizing:border-box}body{margin:0;min-height:100dvh;background:radial-gradient(ellipse at 50% -10%,#2b69e8 0%,#122e70 34%,#090f24 66%,#06080e 100%);background-attachment:fixed}button,input,textarea,select{font:inherit}button{cursor:pointer}button:disabled{opacity:.35;cursor:default}.app{max-width:530px;margin:auto;min-height:100dvh;padding:28px 20px 44px;text-align:center}.eyebrow{font-size:11px;letter-spacing:.22em;font-weight:700;color:#c4d2ff;text-transform:uppercase}.hero{padding-top:clamp(18px,5vh,55px)}.home-title{font-size:clamp(56px,18.5vw,104px);line-height:.84;letter-spacing:-.045em;margin:10px auto 20px;max-width:100%;font-weight:800;text-wrap:nowrap}.home-title span{display:block;white-space:nowrap}.home-subtitle{font-size:clamp(16px,4.6vw,20px);line-height:1.35;margin:0 auto 8px;max-width:420px}h1{font-size:clamp(48px,13vw,76px);line-height:.95;letter-spacing:-.07em;font-weight:750;margin:23px 0;background:linear-gradient(#fff,#a9c0ff);color:transparent;background-clip:text}h2{font-size:clamp(26px,7vw,36px);line-height:1.13;letter-spacing:-.035em;margin:12px 0 25px}p{color:#bec8e4;line-height:1.55}.glass{background:linear-gradient(145deg,#ffffff24,#ffffff0b);border:1px solid #ffffff28;box-shadow:0 18px 50px #0005;backdrop-filter:blur(20px);border-radius:26px;padding:20px}.glow{position:relative;width:min(230px,62vw);height:min(230px,62vw);margin:22px auto 30px;perspective:1000px;filter:drop-shadow(0 18px 30px #536fff54)}.hero-photo-card{position:relative;width:100%;height:100%;border-radius:30px;overflow:hidden;border:1px solid #ffffff55;background:#101a44;transform-style:preserve-3d;animation:kirillTilt 7s ease-in-out infinite;will-change:transform}.hero-photo-card img{width:100%;height:100%;object-fit:cover;display:block}.hero-photo-card:after{content:'';position:absolute;inset:0;background:linear-gradient(115deg,#ffffff38,transparent 38%,transparent 65%,#6852f92e);pointer-events:none}.glow:before{content:'';position:absolute;inset:80% 7% -18%;background:#6c62ff60;filter:blur(23px);border-radius:50%}.hero-photo-shine{position:absolute;inset:0;background:linear-gradient(110deg,transparent 20%,#ffffff25 43%,transparent 58%);animation:kirillShine 6s ease-in-out infinite;pointer-events:none}@keyframes kirillTilt{0%,100%{transform:rotateY(-13deg) rotateX(7deg) rotateZ(-4deg) translateY(0)}25%{transform:rotateY(9deg) rotateX(-4deg) rotateZ(1deg) translateY(-5px)}50%{transform:rotateY(15deg) rotateX(4deg) rotateZ(3deg) translateY(0)}75%{transform:rotateY(-7deg) rotateX(-5deg) rotateZ(-1deg) translateY(5px)}}@keyframes kirillShine{0%,100%{opacity:.15;transform:translateX(-25%)}50%{opacity:.65;transform:translateX(20%)}}@media(prefers-reduced-motion:reduce){.hero-photo-card,.hero-photo-shine{animation:none}}.field{width:100%;border:1px solid #ffffff35;background:#ffffff16;color:white;border-radius:17px;padding:16px;text-align:center;outline:none}.field::placeholder{color:#aab7d5}.primary{width:100%;padding:17px;border:0;border-radius:17px;background:linear-gradient(105deg,#b59aff,#5687ff);color:white;font-weight:700;box-shadow:0 10px 28px #5572ff48}.secondary{border:1px solid #ffffff30;color:#e1e8ff;background:#ffffff12;border-radius:15px;padding:12px 16px}.stack{display:grid;gap:12px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:22px;gap:12px}.progress{height:5px;background:#ffffff22;border-radius:9px;overflow:hidden;margin-bottom:35px}.progress>div{height:100%;background:#a99aff;transition:width .2s}.option{display:block;width:100%;border:1px solid #ffffff2a;background:#ffffff12;color:#f5f7ff;padding:16px;border-radius:16px;text-align:center;min-height:58px}.option.selected{background:#7584ff55;border-color:#bdc3ff}.option.correct{border-color:#65dfa5;background:#23754c66}.option.wrong{border-color:#ff8a9e;background:#94374b66}.photo-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin:15px 0}.photo-card{position:relative;overflow:hidden;border:2px solid #ffffff29;border-radius:17px;background:#ffffff0d;padding:0;color:white}.photo-card.selected{border-color:#b6a2ff}.photo-card img{width:100%;height:195px;object-fit:cover;display:block}.photo-card span{position:absolute;left:8px;bottom:8px;background:#0a103acc;border-radius:9px;padding:6px 10px}.photo-card.empty{height:180px;display:grid;place-items:center;padding:15px;color:#a9b5d5}.small{font-size:12px;color:#aab7d4}.result-number{font-size:72px;font-weight:800;letter-spacing:-.08em;margin:12px}.review{text-align:left;padding:16px;margin:10px 0}.review h3{font-size:16px;margin:0 0 12px}.review p{margin:7px 0;font-size:13px}.good{color:#77efb6}.bad{color:#ff9aa8}.muted{color:#b3c0e0}.editor{max-width:750px;margin:auto;padding:20px}.editor textarea,.editor input,.editor select{width:100%;text-align:left;background:#0e1b38;border:1px solid #ffffff30;color:white;padding:11px;border-radius:10px;margin:5px 0 10px}.editor textarea{min-height:75px;resize:vertical}.edit-card{margin:12px 0;padding:17px;border:1px solid #ffffff25;border-radius:18px;background:#ffffff0b}.editor label{font-size:12px;color:#b8c7e8}.editor .actions{display:flex;gap:8px;flex-wrap:wrap;margin:15px 0}.editor .actions button{flex:1}.hidden{display:none!important}a{color:#c8bcff}hr{border:0;border-top:1px solid #ffffff25;margin:20px 0}
</style><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script><script src="config.js"></script></head><body><main id="app" class="app"></main><script>
const DEFAULT_QUESTIONS=[{"id":"kebab","title":"Как называлось легендарное место, где заканчивалась почти каждая летняя встреча с Кириллом?","options":["026 Kebab","038 Kebab","036 Kebab","039 Kebab"],"correct":2,"note":"Каждая дорога вела в 036 Kebab.","images":[]},{"id":"bella","title":"Что больше всего понравилось Кириллу в однокурснице Беллы?","options":["Квартира в центре","Чуть-чуть вонючка","Озабоченная верой семья"],"correct":1,"note":"Денис подтвердил: «Чуть-чуть вонючка».","images":[]},{"id":"bags","title":"Какая фотография с брендами на сумках настоящая?","options":["Фото A","Фото Б","Фото В","Фото Г"],"correct":1,"note":"Оригинал: Carhartt WIP на обеих сумках.","images":["bags_c","bags_real","bags_a","bags_b"]},{"id":"varlamov","title":"За кем Кирилл бегал по всему Тамбову, чтобы сфотографироваться?","options":["За Ильей Варламовым","За Моргенштерном","За Никитой Власовым","За Бустером"],"correct":0,"note":"","images":[]},{"id":"drink","title":"Какой волшебный напиток Кирилл заказал в «Чтиво» после первой встречи в «Зотове»?","options":["Кола зеро","Креман","Чай"],"correct":0,"note":"Денис подтвердил: кола зеро.","images":[]},{"id":"phone","title":"Из-за чего Кирилл чуть не подрался с другом в 9 классе?","options":["Кто-то спрятал его кроссовки","Кто-то удалил фотографии","Друг выхватил его телефон и бегал с ним по школе","Кто-то взял его теннисную повязку"],"correct":2,"note":"","images":[]},{"id":"fridge","title":"Какое фото холодильника на даче Кирилла настоящее?","options":["Фото A","Фото Б","Фото В","Фото Г"],"correct":2,"note":"В оригинале были Егермейстер, йогурт «Чудо» и пицца.","images":["fridge_a","fridge_c","fridge_real","fridge_b"]},{"id":"nas","title":"Кто был общим любимым исполнителем Кирилла и его друга?","options":["Lil Nas X","The Weeknd","Frank Ocean","Tyler, The Creator"],"correct":0,"note":"","images":[]},{"id":"saga","title":"Сколько раз решения Saga были хуже концепций Apex?","options":["1 раз","0","Saga lovin"],"correct":1,"note":"Денис подтвердил: 0. Вариант «Никогда» заменен, чтобы не было двух одинаковых ответов.","images":[]},{"id":"booster","title":"Чей стиль Кирилл копировал, даже надевая такую же теннисную повязку?","options":["Ильи Варламова","Бустера","Патау Додика","Никиты Власова"],"correct":1,"note":"","images":[]},{"id":"shelf","title":"Какое фото коллекции напитков настоящее?","options":["Фото A","Фото Б","Фото В","Фото Г"],"correct":null,"note":"Пока есть только оригинал. Для честного визуального вопроса нужны три отредактированные версии той же полки.","images":["shelf_real"]},{"id":"gym","title":"Где Кирилл случайно встретил друга одним летом без предварительной договоренности?","options":["На концерте","В книжном магазине","В спортивном зале","В 036 Kebab"],"correct":2,"note":"","images":[]},{"id":"kylie","title":"С какими двумя знаменитостями Кирилл сравнил идеальную «альтушку-солевушку»?","options":["Ким Кардашьян и Дуа Липа","Кайли Дженнер и Катя Кищук","Белла Хадид и Настя Ивлеева","Меган Фокс и Ольга Бузова"],"correct":1,"note":"В том самом поздравлении с автобусным колесом.","images":[]},{"id":"dj","title":"Кто самый легендарный диджей Тамбова по версии лора Кирилла?","options":["DJ Smash","Никита Власов","Бустер","Патау Додик"],"correct":1,"note":"","images":[]},{"id":"nastya","title":"С какой Настей Кирилл особенно плотно общался одним летом?","options":["Настя к-поп","Настя из спортзала","Настя из Питера","Настя из «Чтиво»"],"correct":0,"note":"","images":[]},{"id":"blogger","title":"Кто любимый блогер Кирилла на YouTube?","options":["Меллстрой","Эдвард Бил","Патау Додик","Бустер"],"correct":2,"note":"На новоселье Кирилла смотрели его видео.","images":[]},{"id":"tiger","title":"Как Кирилл с другом прозвали официантку из питерского ресторана Tiger Lily?","options":["Королева Питера","Богиня из Тайгер Лили","Мисс Креман","Императрица кебаба"],"correct":1,"note":"","images":[]}];
const KEY='kirill-lore-questions-v1';let questions=JSON.parse(localStorage.getItem(KEY)||'null')||structuredClone(DEFAULT_QUESTIONS);let player='',idx=0,answers={},started=0,screen='home';let db=null,admin=false,cloudReady=false;try{if(window.KIRILL_CONFIG?.url&&window.KIRILL_CONFIG?.anonKey&&window.supabase){db=window.supabase.createClient(window.KIRILL_CONFIG.url,window.KIRILL_CONFIG.anonKey);cloudReady=true}}catch(e){console.warn(e)}const app=document.getElementById('app');const escapeHtml=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const quizText=s=>escapeHtml(String(s??'').replace(/(^|[\s(«„"—–])((?:в|во|на|с|со|к|ко|у|о|об|от|до|по|за|из|без|для|не|и|а|но|под|над|при|про)) +(?=\S)/giu,(_,before,word)=>before+word+'\u00A0').replace(/(\d) +(?=(?:[А-Яа-яЁёA-Za-z№%]))/g,'$1\u00A0'));const img=k=>k+'.jpg';function save(){localStorage.setItem(KEY,JSON.stringify(questions));if(cloudReady&&admin){clearTimeout(window.saveTimer);window.saveTimer=setTimeout(()=>publishQuestions(),900)}}function nav(s){screen=s;render();window.scrollTo(0,0)}
function render(){app.className=screen==='edit'?'editor':'app';if(screen==='home')home();if(screen==='quiz')quiz();if(screen==='result')result();if(screen==='edit')editor();if(screen==='scores')scores()}
function home(){app.innerHTML=`<div class="hero"><h1 class="home-title"><span>Тест</span><span>по лору</span><span>Кирюшки</span></h1><p class="home-subtitle">Насколько ты погружен в его бэнгеры?</p><div class="glow"><div class="hero-photo-card"><img src="assets/kiryushka-main.webp" alt="Фото Кирюшки"><div class="hero-photo-shine"></div></div></div><div class="glass stack"><div class="eyebrow">ДОПУСК К ЭКЗАМЕНУ</div><input class="field" id="name" maxlength="40" placeholder="Как тебя зовут?" value="${escapeHtml(player)}"><button class="primary" onclick="begin()">Начать экзамен</button></div><p class="small">Результаты и разбор ошибок — в конце</p></div>`}
function begin(){let n=document.getElementById('name').value.trim();if(!n){alert('Введи имя');return}player=n;idx=0;answers={};started=Date.now();nav('quiz')}
function quiz(){let q=questions[idx];if(!q){nav('result');return}let chosen=answers[q.id];app.innerHTML=`<div class="top"><button class="secondary" onclick="nav('home')">← Выход</button><div class="small">${escapeHtml(player)}</div></div><div class="progress"><div style="width:${(idx+1)/questions.length*100}%"></div></div><div class="eyebrow">ВОПРОС ${idx+1}</div><h2>${quizText(q.title)}</h2>${q.images.length?`<div class="photo-grid">${q.options.map((o,i)=>`<button class="photo-card ${chosen===i?'selected':''} ${!q.images[i]?'empty':''}" onclick="choose(${i})">${q.images[i]?`<img src="${img(q.images[i])}" alt="Вариант ${i+1}">`:'Изображение еще не добавлено'}<span>${quizText(o)}</span></button>`).join('')}</div>`:`<div class="stack">${q.options.map((o,i)=>`<button class="option ${chosen===i?'selected':''}" onclick="choose(${i})">${quizText(o)}</button>`).join('')}</div>`}<div style="height:28px"></div><button class="primary" ${chosen===undefined?'disabled':''} onclick="next()">${idx===questions.length-1?'Узнать результат':'Следующий вопрос →'}</button><p class="small">${q.correct===null?'Этот вопрос пока не оценивается':'Правильный ответ откроется в конце'}</p>`}
function choose(i){answers[questions[idx].id]=i;render()}function next(){if(idx<questions.length-1){idx++;render();window.scrollTo(0,0)}else finish()}
function stats(){let graded=questions.filter(q=>q.correct!==null),correct=graded.filter(q=>answers[q.id]===q.correct).length;return {correct,total:graded.length}}
function finish(){let {correct,total}=stats(),entries=JSON.parse(localStorage.getItem('kirill-local-scores')||'[]');entries.push({name:player,correct,total,time:Math.round((Date.now()-started)/1000),at:Date.now()});localStorage.setItem('kirill-local-scores',JSON.stringify(entries));if(cloudReady)db.from('scores').insert({player_name:player,correct_count:correct,total_count:total,duration_seconds:Math.round((Date.now()-started)/1000)}).then(({error})=>{if(error)alert('Результат сохранен только на этом устройстве: '+error.message)});nav('result')}
function result(){let {correct,total}=stats();app.innerHTML=`<div class="eyebrow">ЭКЗАМЕН ЗАВЕРШЕН</div><h1>ЛОР<br>ЗАСЧИТАН</h1><p>${escapeHtml(player)}, твой результат</p><div class="result-number">${correct}/${total}</div><p>${correct===total?'Ты хранитель лора Кирилла.':correct>=total*.7?'Ты явно был рядом с легендой.':'Пора повторить биографию Кирилла.'}</p><div class="glass"><h2>Разбор ответов</h2>${questions.map((q,i)=>{let a=answers[q.id],ok=a===q.correct;return `<div class="review"><div class="small">ВОПРОС ${i+1}</div><h3>${quizText(q.title)}</h3><p class="${q.correct===null?'muted':ok?'good':'bad'}">Твой ответ: ${quizText(q.options[a]||'Нет ответа')} ${q.correct===null?'· без оценки':ok?'✓':'✕'}</p>${q.correct!==null?`<p class="good">Правильно: ${quizText(q.options[q.correct])}</p>`:''}${q.note?`<p class="muted">${quizText(q.note)}</p>`:''}</div>`}).join('<hr>')}</div><div class="stack" style="margin-top:20px"><button class="primary" onclick="nav('scores')">Посмотреть рейтинг</button><button class="secondary" onclick="nav('home')">На главный экран</button></div>`}
async function scores(){let scores=JSON.parse(localStorage.getItem('kirill-local-scores')||'[]').sort((a,b)=>b.correct-a.correct||a.time-b.time);if(cloudReady){let {data,error}=await db.from('scores').select('player_name,correct_count,total_count,duration_seconds').order('correct_count',{ascending:false}).order('duration_seconds',{ascending:true}).limit(100);if(!error)scores=data.map(x=>({name:x.player_name,correct:x.correct_count,total:x.total_count,time:x.duration_seconds}))}app.innerHTML=`<div class="eyebrow">LOCAL HALL OF FAME</div><h1>ЗАЛ<br>СЛАВЫ</h1><p>${cloudReady?'Общий рейтинг всех участников':'Тестовый рейтинг на этом устройстве. Облако еще не подключено.'}</p><div class="glass stack">${scores.length?scores.map((s,i)=>`<div class="option">${i+1}. ${escapeHtml(s.name)} — ${s.correct}/${s.total} · ${s.time} сек.</div>`).join(''):'Пока нет результатов'}</div><div style="height:20px"></div><button class="primary" onclick="nav('home')">На главный экран</button>`}
function editor(){app.innerHTML=`<div class="top"><button class="secondary" onclick="nav('home')">← Главная</button><div class="eyebrow">РЕДАКТОР КВИЗА</div></div><h2>Вопросы и ответы</h2><p>${cloudReady?'Изменения автоматически публикуются в облако после редактирования.':'Пока облако не настроено, изменения сохраняются только в браузере. Скачай JSON для резервной копии.'}</p><div class="actions"><button class="secondary" onclick="downloadJSON()">↓ Скачать JSON</button><button class="secondary" onclick="document.getElementById('import').click()">↑ Импорт JSON</button><button class="secondary" onclick="resetAll()">Сбросить</button><button class="secondary" onclick="publishQuestions()">☁ Опубликовать</button><button class="secondary" onclick="signOutAdmin()">Выйти из админки</button><input class="hidden" id="import" type="file" accept=".json,application/json" onchange="importJSON(this)"></div><div class="small" id="save-state">Готово к редактированию</div><div id="items">${questions.map((q,i)=>editCard(q,i)).join('')}</div><button class="primary" onclick="addQuestion()">+ Добавить вопрос</button>`}
function editCard(q,i){return `<div class="edit-card"><div class="top"><b>${i+1}. ${escapeHtml(q.id)}</b><div><button class="secondary" onclick="moveQ(${i},-1)">↑</button> <button class="secondary" onclick="moveQ(${i},1)">↓</button></div></div><label>Вопрос</label><textarea oninput="setQ(${i},'title',this.value)">${escapeHtml(q.title)}</textarea><label>Варианты (каждый с новой строки)</label><textarea style="min-height:110px" oninput="setOpts(${i},this.value)">${escapeHtml(q.options.join('\n'))}</textarea><label>Правильный ответ</label><select onchange="setCorrect(${i},this.value)"><option value="" ${q.correct===null?'selected':''}>Не выбран — без оценки</option>${q.options.map((o,j)=>`<option value="${j}" ${q.correct===j?'selected':''}>${j+1}. ${escapeHtml(o)}</option>`).join('')}</select><label>Комментарий к ответу</label><textarea oninput="setQ(${i},'note',this.value)">${escapeHtml(q.note||'')}</textarea><div class="small">Фото: ${escapeHtml(q.images.join(', ')||'нет')} · Замена фото в текущей версии через файлы проекта</div><button class="secondary" onclick="deleteQ(${i})">Удалить вопрос</button></div>`}
function setQ(i,k,v){questions[i][k]=v;save()}function setOpts(i,v){questions[i].options=v.split('\n').map(x=>x.trim()).filter(Boolean);questions[i].correct=null;save();}function setCorrect(i,v){questions[i].correct=v===''?null:Number(v);save()}function moveQ(i,d){let j=i+d;if(j<0||j>=questions.length)return;[questions[i],questions[j]]=[questions[j],questions[i]];save();render()}function deleteQ(i){if(confirm('Удалить вопрос?')){questions.splice(i,1);save();render()}}function addQuestion(){questions.push({id:'new'+Date.now(),title:'Новый вопрос',options:['Вариант 1','Вариант 2'],correct:null,note:'',images:[]});save();render()}function resetAll(){if(confirm('Вернуть исходные вопросы?')){questions=structuredClone(DEFAULT_QUESTIONS);save();render()}}function downloadJSON(){let b=new Blob([JSON.stringify(questions,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='kirill-questions-edited.json';a.click();URL.revokeObjectURL(a.href)}function importJSON(el){let f=el.files[0];if(!f)return;f.text().then(t=>{try{let x=JSON.parse(t);if(!Array.isArray(x)||!x.every(q=>Array.isArray(q.options)&&typeof q.title==='string'))throw Error();questions=x;save();render()}catch(e){alert('Неверный формат JSON')}})}
async function loadCloud(){if(!cloudReady)return;let {data,error}=await db.from('quiz_content').select('questions').eq('id',1).single();if(!error&&Array.isArray(data?.questions)){questions=data.questions;localStorage.setItem(KEY,JSON.stringify(questions));render()}}
async function publishQuestions(){if(!cloudReady){alert('Сначала настрой config.js');return}if(!admin){alert('Войди как редактор');return}let {error}=await db.from('quiz_content').update({questions,updated_at:new Date().toISOString()}).eq('id',1);if(error)alert('Ошибка публикации: '+error.message);else document.getElementById('save-state')&&(document.getElementById('save-state').textContent='Сохранено в облаке ✓')}
async function openEditor(){if(!cloudReady){nav('edit');return}let {data:{user}}=await db.auth.getUser();if(user){let {data}=await db.from('admin_users').select('user_id').eq('user_id',user.id).maybeSingle();if(data){admin=true;nav('edit');return}}app.innerHTML=`<div class="hero"><div class="eyebrow">ADMIN ACCESS</div><h1>РЕДАКТОР</h1><p>Введи почту, на которую зарегистрирован администратор Supabase. Получишь одноразовый код или ссылку для входа.</p><div class="glass stack"><input class="field" id="admin-email" type="email" placeholder="Твоя почта"><button class="primary" onclick="sendAdminLink()">Получить ссылку для входа</button><button class="secondary" onclick="nav('home')">Назад</button></div></div>`}
async function sendAdminLink(){let email=document.getElementById('admin-email').value.trim();if(!email)return alert('Укажи почту');let {error}=await db.auth.signInWithOtp({email,options:{emailRedirectTo:location.origin+location.pathname}});alert(error?error.message:'Проверь почту, открой ссылку на этом устройстве и снова нажми «Редактировать вопросы».')}
async function signOutAdmin(){if(db)await db.auth.signOut();admin=false;nav('home')}
async function boot(){render();await loadCloud();if(db){let {data:{user}}=await db.auth.getUser();if(user){let {data}=await db.from('admin_users').select('user_id').eq('user_id',user.id).maybeSingle();admin=!!data}}}boot();
</script></body></html>
