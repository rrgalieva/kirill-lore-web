name: Identify current Netlify production version
on:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    if: github.event.head_commit.message == 'Identify Netlify production source'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Diagnose live publication
        run: |
          set -e
          curl -fsSL --max-time 20 'https://soft-seahorse-fdef96.netlify.app/?versioncheck=20261128' -o /tmp/live.html
          echo "LIVE_BYTES=$(wc -c < /tmp/live.html)"
          echo "CURRENT_REPO_BYTES=$(wc -c < index.html)"
          echo "LIVE_SHA256=$(sha256sum /tmp/live.html | cut -d' ' -f1)"
          echo "REPO_SHA256=$(sha256sum index.html | cut -d' ' -f1)"
          if cmp -s /tmp/live.html index.html; then echo EXACTLY_LIVE_HEAD=YES; else echo EXACTLY_LIVE_HEAD=NO; fi
          for sha in $(git log -40 --format=%H -- index.html); do
            git show "$sha:index.html" >/tmp/candidate.html
            if cmp -s /tmp/live.html /tmp/candidate.html; then echo "MATCHED_PUBLIC_COMMIT=$sha"; break; fi
          done
          python3 - <<'PY'
          from pathlib import Path
          s=Path('/tmp/live.html').read_text(errors='replace')
          for name,phrase in [
           ('NEW_Q8','Ниже, любимый исполнитель'),
           ('OLD_Q8','Кто был общим любимым исполнителем'),
           ('FRIDGE_PHOTOS','fridge_1'),
           ('BAGS_PHOTO','bags-brand.svg'),
           ('NEW_HOME','Насколько ты погружен в его бэнгеры'),
           ('DENISKA','Дениской'),
           ('KIRYUSHKA_HERO','kiryushka-main.webp'),
          ]: print(f'{name}={phrase in s}')
          PY
          for asset in assets/nas_photo.jpg assets/fridge_1.jpg assets/bags-brand.svg; do
             echo "$asset HTTP=$(curl -L -s -o /dev/null -w '%{http_code}' --max-time 20 "https://soft-seahorse-fdef96.netlify.app/$asset")"
          done
          curl -fsSL --max-time 20 'https://api.netlify.com/api/v1/sites/soft-seahorse-fdef96.netlify.app' -o /tmp/netlify.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('/tmp/netlify.json').read_text())
          for k in ['id','name','url','ssl_url','admin_url','repo_url','state','updated_at','published_deploy','build_settings']:
            v=d.get(k)
            if k=='published_deploy' and isinstance(v,dict):
              v={kk:v.get(kk) for kk in ['id','state','created_at','published_at','commit_ref','branch','commit_url','title']}
            if k=='build_settings' and isinstance(v,dict):
              v={kk:v.get(kk) for kk in ['provider','repo_url','repo_branch','repo_path','repo_slug','base','dir','cmd','allowed_branches','stop_builds']}
            print('SITE_'+k+'='+str(v))
          PY
          curl -sSL --max-time 20 -w '\nDEPLOY_LIST_HTTP=%{http_code}\n' 'https://api.netlify.com/api/v1/sites/37bb45da-019e-473f-bb6f-811f568f91e5/deploys?per_page=15' -o /tmp/deploys.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('/tmp/deploys.json').read_text())
          print('DEPLOY_LIST_TYPE='+str(type(d).__name__))
          if isinstance(d,list):
            for x in d[:12]:
              print('DEPLOY_ROW='+str({k:x.get(k) for k in ['id','state','commit_ref','branch','title','created_at','published_at','error_message','context','skipped']}))
          elif isinstance(d,dict):
            print('DEPLOY_LIST_ERROR='+str({k:d.get(k) for k in ['code','message','error','status']}))
          PY
          curl -sSL --max-time 20 -w '\nDEPLOY_DETAIL_HTTP=%{http_code}\n' 'https://api.netlify.com/api/v1/deploys/6b0a42c358869c11cfa397e3' -o /tmp/deploy.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('/tmp/deploy.json').read_text())
          if isinstance(d,dict):
            print('DEPLOY_KEYS='+str(sorted(d.keys())))
            for k in ['state','error_message','error','failure_reason','deploy_time','context','review_id','skipped','summary','build_id','build_settings','framework','title','commit_ref','created_at','published_at','admin_url','deploy_ssl_url','required']:
              print('DETAIL_'+k+'='+str(d.get(k))[:500])
          PY
          echo "DEPLOY_LOG_HTTP=$(curl -sSL -o /dev/null -w '%{http_code}' --max-time 20 'https://api.netlify.com/api/v1/deploys/6b0a42c358869c11cfa397e3/log')"
          curl -sSL --max-time 20 -w '\nBUILD_DETAIL_HTTP=%{http_code}\n' 'https://api.netlify.com/api/v1/builds/6b0a42c358869c11cfa397e1' -o /tmp/build.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          try: d=json.loads(Path('/tmp/build.json').read_text())
          except Exception as e: print('BUILD_ERROR_PARSE='+str(e)); d={}
          if isinstance(d,dict):
            print('BUILD_KEYS='+str(sorted(d.keys())))
            for k in ['id','state','status','error','error_message','failure_reason','deploy_id','created_at','done','title','message','skipped','error_type']:
              print('BUILD_'+k+'='+str(d.get(k))[:500])
          PY
