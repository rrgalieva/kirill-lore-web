name: Check published Netlify version (one-time)
on:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  diagnose:
    if: github.event.head_commit.message == 'Diagnose published Netlify site'
    runs-on: ubuntu-latest
    steps:
      - name: Check live HTML and photo
        run: |
          set -eu
          echo "Repository HEAD: $GITHUB_SHA"
          curl -L -fsS --max-time 20 -H 'Cache-Control: no-cache' 'https://soft-seahorse-fdef96.netlify.app/?diag=251125-q8' -o /tmp/index.html
          echo "Live HTML size: $(wc -c < /tmp/index.html)"
          if grep -q 'Ниже, любимый исполнитель' /tmp/index.html; then echo "NEW_Q8=YES"; else echo "NEW_Q8=NO"; fi
          if grep -q 'Кто был общим любимым исполнителем Кирилла и его друга' /tmp/index.html; then echo "OLD_Q8=YES"; else echo "OLD_Q8=NO"; fi
          if grep -q 'nas_photo' /tmp/index.html; then echo "NEW_IMAGE_REFERENCE=YES"; else echo "NEW_IMAGE_REFERENCE=NO"; fi
          echo "PHOTO_HTTP=$(curl -L -s -o /dev/null -w '%{http_code}' --max-time 20 https://soft-seahorse-fdef96.netlify.app/assets/nas_photo.jpg)"
