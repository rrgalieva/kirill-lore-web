name: Publish quiz to Netlify
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  netlify-prod:
    runs-on: ubuntu-latest
    env:
      NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
      NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
    steps:
      - uses: actions/checkout@v4
      - name: Check existing production version
        run: |
          curl -fsSL --max-time 25 -H "Cache-Control: no-cache" "https://soft-seahorse-fdef96.netlify.app/?check=${GITHUB_SHA}" -o /tmp/production.html
          if grep -q 'Ниже, любимый исполнитель (гей) Кирилла и Пети' /tmp/production.html; then
            echo 'Q8_ON_PRODUCTION=yes'
          else
            echo 'Q8_ON_PRODUCTION=no'
          fi
          echo "Q8_IMAGE_HTTP=$(curl -Ls -o /dev/null -w '%{http_code}' --max-time 20 https://soft-seahorse-fdef96.netlify.app/assets/nas_photo.jpg)"
          if test -n "$NETLIFY_AUTH_TOKEN"; then echo 'NETLIFY_DEPLOY_CREDENTIAL=available'; else echo 'NETLIFY_DEPLOY_CREDENTIAL=not_configured'; fi
      - name: Publish production when Netlify credential is available
        if: env.NETLIFY_AUTH_TOKEN != ''
        run: |
          set -euo pipefail
          if test -z "$NETLIFY_SITE_ID"; then
            NETLIFY_SITE_ID=$(curl --fail --silent --show-error --location --max-time 25 -H "Authorization: Bearer $NETLIFY_AUTH_TOKEN" https://api.netlify.com/api/v1/sites/soft-seahorse-fdef96.netlify.app | python3 -c 'import sys,json; print(json.load(sys.stdin)["id"])')
          fi
          test -n "$NETLIFY_SITE_ID"
          npx --yes netlify-cli@latest deploy --prod --dir=. --site="$NETLIFY_SITE_ID" --message "GitHub $GITHUB_SHA"
      - name: Verify production version
        run: |
          curl -fsSL --max-time 25 -H "Cache-Control: no-cache" "https://soft-seahorse-fdef96.netlify.app/?verify=${GITHUB_SHA}" -o /tmp/production2.html
          if grep -q 'Ниже, любимый исполнитель (гей) Кирилла и Пети' /tmp/production2.html; then
            echo 'FINAL_Q8_LIVE=YES'
          else
            echo 'FINAL_Q8_LIVE=NO'
          fi
